<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Calorie Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app">
    <section class="hero">
      <h1>Calorie Tracker</h1>
      <p>Track meals, estimate calories, and save your daily intake to Google Sheets.</p>
    </section>

    <section class="card summary-card">
      <div>
        <label>Date</label>
        <input type="date" id="dateInput" />
      </div>

      <div>
        <label>Daily Calorie Limit</label>
        <input type="number" id="goalInput" value="1650" />
      </div>

      <div class="status-grid">
        <div class="status-box">
          <h2 id="consumedCalories">0</h2>
          <p>Consumed</p>
        </div>

        <div class="status-box">
          <h2 id="remainingCalories">1650</h2>
          <p id="remainingLabel">Remaining</p>
        </div>
      </div>

      <div class="progress-wrap">
        <div id="progressBar"></div>
      </div>

      <p id="statusText">You have not logged anything yet.</p>
    </section>

    <section class="card">
      <h2>Add Food Intake</h2>

      <label>Meal Type</label>
      <select id="mealInput">
        <option value="Breakfast">Breakfast</option>
        <option value="Lunch">Lunch</option>
        <option value="Dinner">Dinner</option>
        <option value="Snack">Snack</option>
      </select>

      <label>Food Intake</label>
      <textarea id="foodInput" placeholder="Example: 1 cup rice, fried chicken, iced coffee"></textarea>

      <button onclick="estimateCalories()">Estimate Calories</button>

      <label>Estimated Calories</label>
      <input type="number" id="calorieInput" placeholder="Calories will appear here" />

      <label>Notes</label>
      <input type="text" id="notesInput" placeholder="Optional notes" />

      <button class="save-btn" onclick="saveEntry()">Save Entry</button>
    </section>

    <section class="card">
      <h2>Entries for Selected Date</h2>
      <div id="entriesList"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
